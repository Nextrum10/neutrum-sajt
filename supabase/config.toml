# ============================================================
# NEXTRUM — Supabase CLI:s konfiguration
#
# FILEN FINNS FÖR ATT EN DRIFTSÄTTNING INTE SKA SLÅ PÅ JWT-KRAVET
#
# Elva funktioner anropas av något som inte har en inloggad användare:
# en databaswebhook, en trigger, ett pg_cron-jobb, Stripe, en knapp i
# ett mejlprogram, Googles omdirigering tillbaka efter ett godkännande,
# den som gör utbildningsprovet innan hen har ett konto, eller ett barn
# som loggar in med sin egen e-post. De har därför verify_jwt av.
#
# Den inställningen satt länge BARA i dashboarden. En `supabase
# functions deploy` läser den här filen, och saknas raden för en
# funktion får den CLI:ns förval — verify_jwt = true. Då svarar
# funktionen 401 på varje anrop, och eftersom anroparen är en trigger
# eller ett schema finns ingen människa som ser felet: anmälningarna
# slutar mejlas, kön slutar tömmas, och det enda spåret är
# statuskoden i net._http_response.
#
# LÄGGER DU TILL EN FUNKTION SOM INTE HAR INLOGGNING: lägg raden här
# i samma ändring som du driftsätter den. Listan här är sanningen,
# inte dashboarden.
#
#
# VAD SOM SKYDDAR DEM I STÄLLET
#
# Ingen av dem är öppen. Sex kräver en delad hemlighet i en egen
# header, jämförd i konstant tid: fakturering sin egen nyckel eller,
# från schemat, hemligheten i notis_konfig, och lead-notis, notis-ko,
# ansokan-notis, admin-paminnelse och ansokan-gallring hemligheten i
# notis_konfig.
# stripe-webhook kräver Stripes signatur. notis-avanmal kräver en
# HMAC-signerad token i länken och kan bara stänga AV en notis,
# aldrig slå på någon och aldrig läsa något. google-koppla kräver ett
# HMAC-signerat läge som bara en inloggad admin kan ha fått, och
# prövar adminens token själv på alla andra vägar. utbildningsprov
# kräver den slumpade nyckeln ur provlänken och kan bara läsa provets
# läge och spara ett försök. barn-inloggning ger bara en session till
# den som har ett barns bekräftade adress och lösenordet, som Auth
# prövar, och databasen räknar och spärrar försöken.
#
# Att verify_jwt är av betyder alltså inte att funktionen är
# oskyddad. Det betyder att skyddet inte är Supabases Auth.
# ============================================================

project_id = "ddkfiuvcppalutfulvbi"

# Månadskörningen. Anropas av pg_cron-jobbet manadskorning med
# hemligheten ur notis_konfig i x-nextrum-notis (2026-09-28), av en
# inloggad admin, eller med x-fakturering-nyckel. Funktionen prövar
# alla tre vägarna själv.
[functions.fakturering]
verify_jwt = false

# Intresseanmälan. Anropas av databaswebhooken ny-intresseanmalan, som
# skickar hemligheten ur notis_konfig i x-nextrum-notis.
[functions.lead-notis]
verify_jwt = false

# pass-notis och meddelande-notis STOD HÄR fram till Fas 14.0.
#
# Runda 2 bytte deras webhookar mot kötriggrarna bookings_notis och
# messages_notis, som köar i stället för att skicka, och sedan dess
# fanns ingen anropare kvar. Två ACTIVE funktioner utan anropare är
# samma sorts halvfärdighet som gjorde att hela notissystemet en gång
# inte fanns i repot: de ser ut att vara en väg in i systemet, och
# ingen vågar ta bort dem eftersom ingen vet om något ringer dem.
#
# BESLUTET ÄR TAGET: de är pensionerade. Källan är borttagen ur repot
# i samma ändring som de här raderna.
#
# KVAR ATT GÖRA FÖR HAND: de ligger fortfarande ACTIVE i driften.
# Supabase CLI och MCP kan driftsätta en funktion men inte ta bort
# den — det görs i dashboarden under Edge Functions. Tills det är
# gjort svarar de på sin adress, skyddade av den delade hemligheten
# i headern, men de gör ingenting någon ber om.

# Kö-arbetaren. Väcks av pg_cron-jobbet notis-minut genom
# notis_konfig.arbetare_url, med samma hemlighet i headern.
[functions.notis-ko]
verify_jwt = false

# Mejlen till den som sökt jobb (Fas 16.1). Väcks av triggern
# ansokan_besked och omförsöksjobbet genom notis_konfig.ansokan_url,
# med samma hemlighet i headern.
[functions.ansokan-notis]
verify_jwt = false

# Mejlen till admin (2026-10-02): en jobbansökan direkt, och det som ligger
# kvar i Att göra kl. 9 svensk tid. Väcks av triggern admin_ansokan_direkt
# och av intern.admin_paminnelse_koa() (pg_cron-jobbet admin-paminnelse)
# genom notis_konfig.admin_paminnelse_url, med samma hemlighet i headern.
# Står den här raden inte kvar svarar funktionen 401 på varje mejl, och det
# syns bara som notiser som inte gick fram.
[functions.admin-paminnelse]
verify_jwt = false

# Gallringen av ansökningar och CV:n efter ett år. Väcks av pg_cron-
# jobbet ansokan-gallring genom notis_konfig.gallring_url, med samma
# hemlighet i headern. Står den här raden inte kvar svarar funktionen
# 401 varje natt, ingenting gallras, och efter en vecka blir det
# uppgiften "Gallringen av ansökningar har fastnat".
[functions.ansokan-gallring]
verify_jwt = false

# Stripes webhook (Fas 12.2). Anroparen är Stripe, som inte har och
# inte kan ha en Supabase-token. Skyddet är signaturen i
# stripe-signature, prövad i konstant tid mot STRIPE_WEBHOOK_SECRET.
#
# stripe-checkout och stripe-aterbetalning står MED FLIT INTE här: de
# anropas av en inloggad förälder respektive admin, och ska ha
# JWT-kravet kvar. (stripe-konto fanns här förut. Den är borta sedan
# Fas 12.5, både ur repot och ur driften.)
[functions.stripe-webhook]
verify_jwt = false

# Avanmälan ur ett mejl. Måste fungera utan inloggning — mottagaren
# är ofta inte inloggad, och mejlprogrammets One-Click-knapp
# (RFC 8058) POSTar utan att någon öppnar sajten. Skyddet är
# signaturen i tokenen.
[functions.notis-avanmal]
verify_jwt = false

# Kopplingen till Google (Fas 18.1). Google skickar tillbaka
# webbläsaren hit efter godkännandet, med en vanlig omdirigering, och
# den bär ingen Supabase-token. Skyddet på den vägen är det signerade
# läget i state (HMAC med klienthemligheten, tio minuter, säger vilken
# admin som började). Knapparna i adminvyn POSTar till samma funktion
# och prövar adminens token själva med kravAdmin.
#
# google-meet står MED FLIT INTE här: den anropas av en inloggad
# familj eller studiehjälpare från passets sida och ska ha JWT-kravet.
[functions.google-koppla]
verify_jwt = false

# Utbildningsprovet (Fas 22.1). Den som gör provet har sökt jobb men
# har inget konto än: kontot skapas i steget efter provet. Skyddet är
# den slumpade nyckeln i länken i mejlet (applications.prov_nyckel),
# som bara öppnar provet för en ansökan. Funktionen når databasen bara
# genom utbildningsprov_lage och utbildningsprov_lamna.
[functions.utbildningsprov]
verify_jwt = false

# Barnets inloggning med sin egen e-post (barnets_epost, 2026-10-01).
# Den som loggar in har ingen session än. Funktionen slår upp barnets
# tekniska adress i databasen (barn_inloggning_uppslag, bara
# service_role) och loggar in med den hos Auth, som prövar lösenordet.
# Databasen räknar varje försök per adress och per IP-nummer, och
# svaret är detsamma oavsett om adressen finns (_delad/barninloggning.ts).
# Med flaggan barn_epost av säger den nej till allt.
[functions.barn-inloggning]
verify_jwt = false
