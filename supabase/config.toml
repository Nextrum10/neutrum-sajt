# ============================================================
# NEXTRUM — Supabase CLI:s konfiguration
#
# FILEN FINNS FÖR ATT EN DRIFTSÄTTNING INTE SKA SLÅ PÅ JWT-KRAVET
#
# Sex funktioner anropas av något som inte har en inloggad användare:
# en databaswebhook, en trigger, ett pg_cron-jobb eller en knapp i ett
# mejlprogram. De har därför verify_jwt av.
#
# Den inställningen satt länge BARA i dashboarden. En `supabase
# functions deploy` läser den här filen, och saknas raden för en
# funktion får den CLI:ns förval — verify_jwt = true. Då svarar
# funktionen 401 på varje anrop, och eftersom anroparen är en trigger
# eller ett schema finns ingen människa som ser felet: anmälningarna
# slutar mejlas, kön slutar tömmas, och det enda spåret är
# statuskoden i net._http_response.
#
# LÄGGER DU TILL EN FUNKTION SOM INTE HAR INLOGGNING: lägg raden här
# i samma ändring som du driftsätter den. Listan här är sanningen,
# inte dashboarden.
#
#
# VAD SOM SKYDDAR DEM I STÄLLET
#
# Ingen av dem är öppen. Fem kräver en delad hemlighet i en egen
# header, jämförd i konstant tid mot en rad i databasen. Den sjätte,
# notis-avanmal, kräver en HMAC-signerad token i länken och kan bara
# stänga AV en notis, aldrig slå på någon och aldrig läsa något.
#
# Att verify_jwt är av betyder alltså inte att funktionen är
# oskyddad. Det betyder att skyddet inte är Supabases Auth.
# ============================================================

project_id = "ddkfiuvcppalutfulvbi"

# Månadskörningen. Anropas av ett schema med x-fakturering-nyckel,
# eller av en inloggad admin (funktionen prövar båda vägarna själv).
[functions.fakturering]
verify_jwt = false

# Intresseanmälan. Anropas av databaswebhooken ny-intresseanmalan, som
# skickar hemligheten ur notis_konfig i x-nextrum-notis.
[functions.lead-notis]
verify_jwt = false

# pass-notis och meddelande-notis STOD HÄR fram till Fas 14.0.
#
# Runda 2 bytte deras webhookar mot kötriggrarna bookings_notis och
# messages_notis, som köar i stället för att skicka, och sedan dess
# fanns ingen anropare kvar. Två ACTIVE funktioner utan anropare är
# samma sorts halvfärdighet som gjorde att hela notissystemet en gång
# inte fanns i repot: de ser ut att vara en väg in i systemet, och
# ingen vågar ta bort dem eftersom ingen vet om något ringer dem.
#
# BESLUTET ÄR TAGET: de är pensionerade. Källan är borttagen ur repot
# i samma ändring som de här raderna.
#
# KVAR ATT GÖRA FÖR HAND: de ligger fortfarande ACTIVE i driften.
# Supabase CLI och MCP kan driftsätta en funktion men inte ta bort
# den — det görs i dashboarden under Edge Functions. Tills det är
# gjort svarar de på sin adress, skyddade av den delade hemligheten
# i headern, men de gör ingenting någon ber om.

# Kö-arbetaren. Väcks av pg_cron-jobbet notis-minut genom
# notis_konfig.arbetare_url, med samma hemlighet i headern.
[functions.notis-ko]
verify_jwt = false

# Stripes webhook (Fas 12.2). Anroparen är Stripe, som inte har och
# inte kan ha en Supabase-token. Skyddet är signaturen i
# stripe-signature, prövad i konstant tid mot STRIPE_WEBHOOK_SECRET.
#
# stripe-checkout och stripe-aterbetalning står MED FLIT INTE här: de
# anropas av en inloggad förälder respektive admin, och ska ha
# JWT-kravet kvar. (stripe-konto fanns här förut. Den är borta sedan
# Fas 12.5, både ur repot och ur driften.)
[functions.stripe-webhook]
verify_jwt = false

# Avanmälan ur ett mejl. Måste fungera utan inloggning — mottagaren
# är ofta inte inloggad, och mejlprogrammets One-Click-knapp
# (RFC 8058) POSTar utan att någon öppnar sajten. Skyddet är
# signaturen i tokenen.
[functions.notis-avanmal]
verify_jwt = false
