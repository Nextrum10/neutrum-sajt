# ============================================================
# NEXTRUM — Supabase-konfiguration
#
# Den här filen finns för EN inställning: verify_jwt.
#
# Sex av funktionerna anropas utan inloggning och måste därför ha
# JWT-kravet avstängt i porten. Den inställningen har hittills bara
# funnits i Supabases webbgränssnitt, alltså ingenstans som går att
# läsa, granska eller återskapa ur repot. En `supabase functions
# deploy` från main hade slagit på kravet igen — och de tre
# notisfunktionerna anropas av databaswebhookar, som inte har någon
# som läser svaret. Mejlen hade slutat komma, tyst.
#
# verify_jwt = false betyder INTE att funktionen är öppen. Alla sex
# gör sin egen kontroll i koden, och den är hårdare än portens:
#
#   · lead-notis, pass-notis, meddelande-notis
#     delad hemlighet i en header, hämtad ur notis_konfig. Den ligger
#     i en tabell och inte i en secret med flit: en secret och en
#     webhook-header i två olika fönster glider isär, och då svarar
#     funktionen 401 på varje anmälan emellan.
#
#   · fakturering
#     x-fakturering-nyckel jämförd i konstant tid, ELLER en inloggad
#     admin vars behörighet läses med anroparens egen token innan
#     service_role används till något.
#
#   · notis-ko, notis-avanmal
#     se längst ner.
#
# Alla andra funktioner kräver JWT, vilket är Supabases förval. De
# står därför inte här: en lista som upprepar förvalet blir en lista
# som glöms bort när en ny funktion tillkommer.
# ============================================================

project_id = "ddkfiuvcppalutfulvbi"

[functions.lead-notis]
verify_jwt = false

[functions.pass-notis]
verify_jwt = false

[functions.meddelande-notis]
verify_jwt = false

[functions.fakturering]
verify_jwt = false

# ------------------------------------------------------------
# notis-ko och notis-avanmal (program 2, Fas 2). Koden ligger i
# supabase/functions/ och ersätter de äldre versionerna som låg i
# driften utan att finnas i git (supabase/funktioner-arkiv/).
#
#   · notis-ko
#     anropas av databasen (notis_minut via pg_net) med samma delade
#     hemlighet i x-nextrum-notis som de andra notisfunktionerna.
#     Det finns ingen inloggad användare att hämta en JWT från.
#
#   · notis-avanmal
#     avregistreringslänken i mejlen måste fungera utan inloggning,
#     också när mejlprogrammet själv POSTar (List-Unsubscribe-Post)
#     eller öppnar adressen i webbläsaren (GET, som skickas vidare
#     till nextrum.se/avanmal). Skyddet är HMAC-signaturen i tokenen,
#     och tokenen kan bara stänga av en sak för en person.
# ------------------------------------------------------------

[functions.notis-ko]
verify_jwt = false

[functions.notis-avanmal]
verify_jwt = false
